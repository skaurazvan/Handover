<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shift Report</title>

<style>
body { font-family: Arial; padding: 20px; background: #f5f5f5; }
h2, h3 { margin-top: 20px; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; background: white; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
input, select, textarea { width: 100%; padding: 5px; }
button { margin-top: 15px; padding: 10px 15px; cursor: pointer; }
.output { margin-top: 20px; white-space: pre-wrap; border: 2px solid #000; padding: 10px; background: white; }
</style>

</head>

<body>

<h2>Shift Report Generator</h2>

<label>Date:</label>
<input type="date" id="date"><br><br>

<label>Shift:</label>
<select id="shift">
  <option>Morning</option>
  <option>Night</option>
</select><br><br>

<label>Report by:</label>
<input type="text" id="reportBy"><br><br>

<h3>Machine Report</h3>

<table id="machineTable">
<tr>
<th>Machine</th>
<th>Status</th>
<th>Report</th>
</tr>

<tr>
<td><input type="text" value="M1"></td>
<td>
<select>
<option>🟢 Running</option>
<option>🟡 Issue</option>
<option>🔴 Down</option>
<option>🛠 Maintenance</option>
</select>
</td>
<td><input type="text"></td>
</tr>

<tr>
<td><input type="text" value="M2"></td>
<td>
<select>
<option>🟢 Running</option>
<option>🟡 Issue</option>
<option>🔴 Down</option>
<option>🛠 Maintenance</option>
</select>
</td>
<td><input type="text"></td>
</tr>

</table>

<button onclick="addRow()">➕ Add Machine</button>

<h3>Incidents</h3>
<input type="checkbox" id="noIssues"> ✔ No issues<br>
<textarea id="incidents"></textarea>

<h3>Actions Required</h3>
<input type="checkbox" id="noActions"> ✔ No actions required<br>
<textarea id="actions"></textarea>

<br>
<button onclick="generateReport()">📋 Generate Report</button>
<button onclick="copyReport()">📎 Copy to Clipboard</button>

<h3>Output (copy into Teams)</h3>
<div class="output" id="output"></div>

<script>
function addRow() {
  let table = document.getElementById("machineTable");
  let row = table.insertRow();

  row.innerHTML = `
    <td><input type="text"></td>
    <td>
      <select>
        <option>🟢 Running</option>
        <option>🟡 Issue</option>
        <option>🔴 Down</option>
        <option>🛠 Maintenance</option>
      </select>
    </td>
    <td><input type="text"></td>
  `;
}

function generateReport() {
  let date = document.getElementById("date").value;
  let shift = document.getElementById("shift").value;
  let reportBy = document.getElementById("reportBy").value;

  let output = `📅 Date: ${date}
`;
  output += `🕒 Shift: ${shift}
`;
  output += `👤 Report by: ${reportBy}

`;

  output += `--- MACHINE REPORT ---
`;

  let table = document.getElementById("machineTable");
  for (let i = 1; i < table.rows.length; i++) {
    let cells = table.rows[i].cells;
    let machine = cells[0].querySelector("input").value;
    let status = cells[1].querySelector("select").value;
    let report = cells[2].querySelector("input").value;

    if(machine) {
      output += `${machine} | ${status} | ${report}
`;
    }
  }

  output += `
--- INCIDENTS ---
`;
  if (document.getElementById("noIssues").checked) {
    output += "✔ No issues
";
  } else {
    output += document.getElementById("incidents").value + "
";
  }

  output += `
--- ACTIONS REQUIRED ---
`;
  if (document.getElementById("noActions").checked) {
    output += "✔ No actions required
";
  } else {
    output += document.getElementById("actions").value + "
";
  }

  document.getElementById("output").innerText = output;
}

function copyReport() {
  let text = document.getElementById("output").innerText;
  navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
