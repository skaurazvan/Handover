<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handover">
<meta name="theme-color" content="#1f2937">
<title>Shift Handover</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='32' fill='%231f2937'/%3E%3Ctext x='90' y='118' font-family='monospace' font-size='90' font-weight='700' fill='%23fff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #f5f6f8;
    color: #1f2937;
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    padding: 20px 16px 60px;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-bottom: calc(60px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  input, select, textarea {
    background: #ffffff;
    border: 1px solid #d1d5db;
    color: #111827;
    border-radius: 4px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #2d5a87;
    box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
  }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  textarea:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
  .label {
    font-size: 10.5px; font-weight: 600; color: #4b5563;
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px;
  }
  .card {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 6px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .btn {
    border: none; border-radius: 4px;
    padding: 10px 18px; font-family: inherit;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.01em;
  }
  .btn-primary { background: #2d5a87; color: #fff; border: 1px solid #244a72; }
  .btn-primary:active { background: #1d3b5c; }
  .btn-ghost { background: #fff; color: #4b5563; border: 1px solid #d1d5db; }
  .btn-ghost:active { background: #f9fafb; }
  .btn-copy { background: #2d5a87; color: #fff; font-size: 13px; padding: 7px 14px; border: 1px solid #244a72; }
  .btn-copy.copied { background: #0f766e; border-color: #0d5f5a; }
  .btn-remove {
    background: transparent; color: #9ca3af; border: 1px solid #e5e7eb;
    padding: 0; width: 30px; height: 30px; font-size: 13px;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .row-grid {
    display: grid; grid-template-columns: 1.1fr 1fr 1.6fr 30px;
    gap: 6px; align-items: center; margin-bottom: 7px;
  }
  .col-head {
    font-size: 10.5px; font-weight: 600; color: #6b7280;
    letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 4px;
  }
  .output-box {
    background: #0f172a; border: 1px solid #1e293b;
    border-radius: 4px; padding: 14px;
    font-family: 'IBM Plex Mono', 'Menlo', monospace;
    font-size: 11.5px; line-height: 1.65; color: #cbd5e1;
    white-space: pre; word-break: normal;
    max-height: 340px; overflow: auto;
  }
  .section-title {
    font-size: 11px; font-weight: 700; color: #374151;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid #e5e7eb;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chk-wrap {
    display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none;
    font-size: 11px; font-weight: 600;
    color: #4b5563; letter-spacing: 0.04em;
  }
  .chk {
    width: 18px; height: 18px; border: 1.5px solid #9ca3af;
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    background: #fff; transition: all 0.15s; color: #fff; font-size: 13px; font-weight: 700;
  }
  .chk.on { background: #2d5a87; border-color: #2d5a87; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 0 20px; border-bottom: 2px solid #1f2937;
    margin-bottom: 22px;
  }
  .brand-mark {
    width: 38px; height: 38px; background: #1f2937; color: #fff;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600;
  }
  .brand-title { font-size: 17px; font-weight: 700; color: #111827; line-height: 1.1; }
  .brand-sub {
    font-size: 11px; color: #6b7280; letter-spacing: 0.04em;
    text-transform: uppercase; margin-top: 3px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .offline-badge {
    display: inline-block; font-size: 9.5px; font-weight: 600;
    padding: 2px 6px; border-radius: 3px; letter-spacing: 0.05em;
    text-transform: uppercase; margin-left: 6px;
    background: #dcfce7; color: #166534; border: 1px solid #86efac;
  }
  .help {
    margin-top: 10px; font-size: 11px; color: #6b7280;
    font-family: 'IBM Plex Mono', monospace;
  }
  .hint-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px; align-items: center;
  }
</style>
</head>
<body>

<div class="brand">
  <div class="brand-mark">H—</div>
  <div>
    <div class="brand-title">Shift Handover <span class="offline-badge" id="offlineBadge">● Offline Ready</span></div>
    <div class="brand-sub">Production / Teams Export</div>
  </div>
</div>

<!-- Shift Info -->
<div class="card">
  <div class="section-title"><span>Shift Information</span></div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
    <div>
      <div class="label">Date</div>
      <input type="date" id="date" />
    </div>
    <div>
      <div class="label">Shift</div>
      <select id="shift">
        <option>Morning</option>
        <option>Night</option>
      </select>
    </div>
  </div>
  <div>
    <div class="label">Handover By</div>
    <input id="by" placeholder="Your name" />
  </div>
</div>

<!-- Machine Rows -->
<div class="card">
  <div class="section-title"><span>Machine Status</span></div>
  <div class="row-grid" style="margin-bottom: 6px;">
    <div class="col-head">Machine</div>
    <div class="col-head">Status</div>
    <div class="col-head">Report</div>
    <div></div>
  </div>
  <div id="rows"></div>
  <button class="btn btn-ghost" id="addRow" style="margin-top: 8px; font-size: 13px; padding: 8px 14px;">+ Add Machine</button>
</div>

<!-- Incidents -->
<div class="card">
  <div class="section-title">
    <span>Incidents / Issues</span>
    <label class="chk-wrap" id="noIssuesLabel">
      <span class="chk" id="noIssuesChk"></span>
      <span>No Issues</span>
    </label>
  </div>
  <textarea id="incidents" rows="3" placeholder="Describe any incidents, faults, or quality issues during the shift..."></textarea>
</div>

<!-- Actions -->
<div class="card">
  <div class="section-title">
    <span>Actions Required</span>
    <label class="chk-wrap" id="noActionsLabel">
      <span class="chk" id="noActionsChk"></span>
      <span>No Action Required</span>
    </label>
  </div>
  <textarea id="actions" rows="3" placeholder="List any tasks or follow-ups for the incoming shift..."></textarea>
</div>

<button class="btn btn-primary" id="generate" style="width: 100%; padding: 13px; font-size: 14px; margin-bottom: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">
  Generate Handover
</button>

<!-- Output (hidden initially) -->
<div class="card" id="outputCard" style="display: none;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb;">
    <div style="font-size: 11px; font-weight: 700; color: #374151; letter-spacing: 0.12em; text-transform: uppercase;">Teams Output</div>
    <button class="btn btn-copy" id="copyBtn">Copy to Clipboard</button>
  </div>
  <div class="output-box" id="output"></div>
  <div class="help">→ Paste directly into Teams chat. Code block preserves monospace alignment.</div>
</div>

<script>
// ============= STATE =============
const STATUSES = ["✅ Running", "⚠️ Issue", "🔴 Down", "🔧 Maintenance"];
let rows = [];
let noIssues = false;
let noActions = false;

// ============= PERSISTENCE =============
const STORAGE_KEY = 'handover-state-v1';

function saveState() {
  try {
    const state = {
      date: document.getElementById('date').value,
      shift: document.getElementById('shift').value,
      by: document.getElementById('by').value,
      rows: rows,
      incidents: document.getElementById('incidents').value,
      actions: document.getElementById('actions').value,
      noIssues, noActions
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

// ============= WIDTH CALC =============
function visualWidth(str) {
  const emojiRegex = /\p{Extended_Pictographic}/gu;
  const emojiCount = (str.match(emojiRegex) || []).length;
  const vs16Count = (str.match(/\uFE0F/g) || []).length;
  const codePoints = [...str].length;
  return codePoints + emojiCount - vs16Count;
}
function padVisual(str, targetWidth) {
  const diff = targetWidth - visualWidth(str);
  return str + " ".repeat(Math.max(0, diff));
}

// ============= ROW RENDERING =============
function renderRows() {
  const container = document.getElementById('rows');
  container.innerHTML = '';
  rows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'row-grid';
    div.innerHTML = `
      <input placeholder="e.g. IMM-01" value="${escapeAttr(row.machine)}" data-i="${i}" data-f="machine" />
      <select data-i="${i}" data-f="status">
        ${STATUSES.map(s => `<option${s === row.status ? ' selected' : ''}>${s}</option>`).join('')}
      </select>
      <input placeholder="Report notes..." value="${escapeAttr(row.report)}" data-i="${i}" data-f="report" />
      <button class="btn btn-remove" data-i="${i}" data-act="remove">✕</button>
    `;
    container.appendChild(div);
  });

  // Wire up inputs
  container.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      const f = e.target.dataset.f;
      let val = e.target.value;
      if (f === 'machine') val = val.toUpperCase();
      rows[i][f] = val;
      if (f === 'machine' && e.target.value !== val) e.target.value = val;
      saveState();
    });
    el.addEventListener('change', e => {
      const i = +e.target.dataset.i;
      const f = e.target.dataset.f;
      rows[i][f] = e.target.value;
      saveState();
    });
  });
  container.querySelectorAll('button[data-act="remove"]').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = +e.target.dataset.i;
      rows.splice(i, 1);
      renderRows();
      saveState();
    });
  });
}

function escapeAttr(s) {
  return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// ============= CHECKBOXES =============
function updateChk() {
  document.getElementById('noIssuesChk').className = 'chk' + (noIssues ? ' on' : '');
  document.getElementById('noIssuesChk').textContent = noIssues ? '✓' : '';
  document.getElementById('noActionsChk').className = 'chk' + (noActions ? ' on' : '');
  document.getElementById('noActionsChk').textContent = noActions ? '✓' : '';

  const inc = document.getElementById('incidents');
  const act = document.getElementById('actions');
  if (noIssues) { inc.value = 'None — no issues reported.'; inc.disabled = true; }
  else { if (inc.value === 'None — no issues reported.') inc.value = ''; inc.disabled = false; }
  if (noActions) { act.value = 'None — no action required.'; act.disabled = true; }
  else { if (act.value === 'None — no action required.') act.value = ''; act.disabled = false; }
}

document.getElementById('noIssuesLabel').addEventListener('click', e => {
  e.preventDefault();
  noIssues = !noIssues; updateChk(); saveState();
});
document.getElementById('noActionsLabel').addEventListener('click', e => {
  e.preventDefault();
  noActions = !noActions; updateChk(); saveState();
});

// ============= GENERATE =============
document.getElementById('generate').addEventListener('click', () => {
  const date = document.getElementById('date').value;
  const shift = document.getElementById('shift').value;
  const by = document.getElementById('by').value;
  const incidents = document.getElementById('incidents').value;
  const actions = document.getElementById('actions').value;

  const header = `📋 **SHIFT HANDOVER** | ${date} | ${shift} Shift`;
  const meta = `**Handover By:** ${by || '—'}`;
  const divider = '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━';

  const filtered = rows.filter(r => (r.machine || '').trim());

  const col1 = Math.max(visualWidth('Machine'), ...filtered.map(r => visualWidth(r.machine)));
  const col2 = Math.max(visualWidth('Status'), ...filtered.map(r => visualWidth(r.status)));
  const col3 = Math.max(visualWidth('Report'), ...filtered.map(r => visualWidth(r.report || '—')));

  const top = `┌─${'─'.repeat(col1)}─┬─${'─'.repeat(col2)}─┬─${'─'.repeat(col3)}─┐`;
  const sep = `├─${'─'.repeat(col1)}─┼─${'─'.repeat(col2)}─┼─${'─'.repeat(col3)}─┤`;
  const bot = `└─${'─'.repeat(col1)}─┴─${'─'.repeat(col2)}─┴─${'─'.repeat(col3)}─┘`;
  const hdr = `│ ${padVisual('Machine', col1)} │ ${padVisual('Status', col2)} │ ${padVisual('Report', col3)} │`;

  const dataLines = filtered.map(r =>
    `│ ${padVisual(r.machine, col1)} │ ${padVisual(r.status, col2)} │ ${padVisual(r.report || '—', col3)} │`
  );

  const tableLines = ['```', top, hdr, sep];
  dataLines.forEach((line, i) => {
    tableLines.push(line);
    if (i < dataLines.length - 1) tableLines.push(sep);
  });
  tableLines.push(bot, '```');
  const tableBlock = tableLines.join('\n');

  const incText = incidents.trim();
  const actText = actions.trim();
  const incBlock = incText ? `\n⚠️ **Incidents / Issues:**\n${incText}\n` : '';
  const actBlock = actText ? `\n📌 **Actions Required:**\n${actText}\n` : '';

  const result = [header, meta, divider, tableBlock, incBlock, actBlock, divider].join('\n');

  document.getElementById('output').textContent = result;
  document.getElementById('outputCard').style.display = 'block';
  document.getElementById('copyBtn').textContent = 'Copy to Clipboard';
  document.getElementById('copyBtn').className = 'btn btn-copy';
});

// ============= COPY =============
document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('output').textContent;
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else { fallback(); }
  const btn = document.getElementById('copyBtn');
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = 'Copy to Clipboard';
    btn.classList.remove('copied');
  }, 2500);
});

// ============= ADD ROW =============
document.getElementById('addRow').addEventListener('click', () => {
  rows.push({ machine: '', status: '✅ Running', report: '' });
  renderRows(); saveState();
});

// ============= PERSIST INPUTS =============
['date','shift','by','incidents','actions'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveState);
  document.getElementById(id).addEventListener('change', saveState);
});

// ============= INIT =============
(function init() {
  const saved = loadState();
  if (saved) {
    document.getElementById('date').value = saved.date || new Date().toISOString().slice(0, 10);
    document.getElementById('shift').value = saved.shift || 'Morning';
    document.getElementById('by').value = saved.by || '';
    document.getElementById('incidents').value = saved.incidents || '';
    document.getElementById('actions').value = saved.actions || '';
    rows = saved.rows && saved.rows.length ? saved.rows : [
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' }
    ];
    noIssues = !!saved.noIssues;
    noActions = !!saved.noActions;
  } else {
    document.getElementById('date').value = new Date().toISOString().slice(0, 10);
    rows = [
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' }
    ];
  }
  renderRows();
  updateChk();
})();

// ============= OFFLINE / SERVICE WORKER =============
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // SW not available — page still works offline via iOS home screen cache
    });
  });
}
</script>

</body>
</html>
