<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handover">
<meta name="theme-color" content="#1f2937">
<title>Shift Handover</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='32' fill='%231f2937'/%3E%3Ctext x='90' y='118' font-family='monospace' font-size='90' font-weight='700' fill='%23fff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: #f5f6f8; color: #1f2937;
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    padding: 20px 16px 60px;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-bottom: calc(60px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  }
  input, select, textarea {
    background: #fff; border: 1px solid #d1d5db; color: #111827;
    border-radius: 4px; padding: 9px 11px; font-family: inherit;
    font-size: 14px; width: 100%; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #2d5a87; box-shadow: 0 0 0 3px rgba(45,90,135,0.12);
  }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  textarea:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
  .label {
    font-size: 10.5px; font-weight: 600; color: #4b5563;
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px;
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 6px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .btn {
    border: none; border-radius: 4px; padding: 10px 18px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: #2d5a87; color: #fff; border: 1px solid #244a72; }
  .btn-primary:active { background: #1d3b5c; }
  .btn-ghost { background: #fff; color: #4b5563; border: 1px solid #d1d5db; }
  .btn-ghost:active { background: #f9fafb; }
  .btn-copy { background: #2d5a87; color: #fff; font-size: 13px; padding: 7px 14px; border: 1px solid #244a72; }
  .btn-copy.copied { background: #0f766e; border-color: #0d5f5a; }
  .btn-remove {
    background: transparent; color: #9ca3af; border: 1px solid #e5e7eb;
    padding: 0; width: 30px; height: 30px; font-size: 13px;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .row-grid {
    display: grid; grid-template-columns: 1.1fr 1fr 1.6fr 30px;
    gap: 6px; align-items: center; margin-bottom: 7px;
  }
  .col-head {
    font-size: 10.5px; font-weight: 600; color: #6b7280;
    letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 4px;
  }
  .section-title {
    font-size: 11px; font-weight: 700; color: #374151;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chk-wrap {
    display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none; font-size: 11px;
    font-weight: 600; color: #4b5563; letter-spacing: 0.04em;
  }
  .chk {
    width: 18px; height: 18px; border: 1.5px solid #9ca3af;
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    background: #fff; transition: all 0.15s; color: #fff;
    font-size: 13px; font-weight: 700;
  }
  .chk.on { background: #2d5a87; border-color: #2d5a87; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 0 20px; border-bottom: 2px solid #1f2937; margin-bottom: 22px;
  }
  .brand-mark {
    width: 38px; height: 38px; background: #1f2937; color: #fff;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600;
  }
  .brand-title { font-size: 17px; font-weight: 700; color: #111827; line-height: 1.1; }
  .brand-sub {
    font-size: 11px; color: #6b7280; letter-spacing: 0.04em;
    text-transform: uppercase; margin-top: 3px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .offline-badge {
    display: inline-block; font-size: 9.5px; font-weight: 600;
    padding: 2px 6px; border-radius: 3px; letter-spacing: 0.05em;
    text-transform: uppercase; margin-left: 6px;
    background: #dcfce7; color: #166534; border: 1px solid #86efac;
  }
  /* Teams Preview */
  .preview {
    background: #fafbfc; border: 1px solid #e1e4e8;
    border-radius: 4px; padding: 16px;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5; color: #24292e;
  }
  .preview-heading { font-weight: 700; font-size: 15px; margin-bottom: 4px; color: #111; }
  .preview-meta { color: #444; margin-bottom: 14px; }
  .preview-table {
    width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13.5px;
  }
  .preview-table th {
    background: #f1f3f5; text-align: left;
    padding: 8px 10px; border: 1px solid #d0d7de;
    font-weight: 600; color: #24292e;
  }
  .preview-table td {
    padding: 8px 10px; border: 1px solid #d0d7de; background: #fff;
  }
  .preview-section { margin-top: 12px; line-height: 1.5; }
  .preview-section strong { color: #111; }
  .help {
    margin-top: 14px; font-size: 11px; color: #6b7280;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

<div class="brand">
  <div class="brand-mark">H—</div>
  <div>
    <div class="brand-title">Shift Handover <span class="offline-badge">● Offline Ready</span></div>
    <div class="brand-sub">Production / Teams Export</div>
  </div>
</div>

<!-- Shift Info -->
<div class="card">
  <div class="section-title"><span>Shift Information</span></div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
    <div>
      <div class="label">Date</div>
      <input type="date" id="date" />
    </div>
    <div>
      <div class="label">Shift</div>
      <select id="shift">
        <option>Morning</option>
        <option>Night</option>
      </select>
    </div>
  </div>
  <div>
    <div class="label">Handover By</div>
    <input id="by" placeholder="Your name" />
  </div>
</div>

<!-- Machine Rows -->
<div class="card">
  <div class="section-title"><span>Machine Status</span></div>
  <div class="row-grid" style="margin-bottom: 6px;">
    <div class="col-head">Machine</div>
    <div class="col-head">Status</div>
    <div class="col-head">Report</div>
    <div></div>
  </div>
  <div id="rows"></div>
  <button class="btn btn-ghost" id="addRow" style="margin-top: 8px; font-size: 13px; padding: 8px 14px;">+ Add Machine</button>
</div>

<!-- Incidents -->
<div class="card">
  <div class="section-title">
    <span>Incidents / Issues</span>
    <label class="chk-wrap" id="noIssuesLabel">
      <span class="chk" id="noIssuesChk"></span>
      <span>No Issues</span>
    </label>
  </div>
  <textarea id="incidents" rows="3" placeholder="Describe any incidents, faults, or quality issues during the shift..."></textarea>
</div>

<!-- Actions -->
<div class="card">
  <div class="section-title">
    <span>Actions Required</span>
    <label class="chk-wrap" id="noActionsLabel">
      <span class="chk" id="noActionsChk"></span>
      <span>No Action Required</span>
    </label>
  </div>
  <textarea id="actions" rows="3" placeholder="List any tasks or follow-ups for the incoming shift..."></textarea>
</div>

<button class="btn btn-primary" id="generate" style="width: 100%; padding: 13px; font-size: 14px; margin-bottom: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">
  Generate Handover
</button>

<!-- Output -->
<div class="card" id="outputCard" style="display: none;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb;">
    <div style="font-size: 11px; font-weight: 700; color: #374151; letter-spacing: 0.12em; text-transform: uppercase;">How it looks in Teams</div>
    <button class="btn btn-copy" id="copyBtn">Copy</button>
  </div>
  <div class="preview" id="preview"></div>
  <div class="help">→ Tap Copy, then paste into Teams chat. Teams will render the table properly.</div>
</div>

<script>
const STATUSES = ["✅ Running", "⚠️ Issue", "🔴 Down", "🔧 Maintenance"];
let rows = [];
let noIssues = false, noActions = false;
const STORAGE_KEY = 'handover-state-v2';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: getEl('date').value, shift: getEl('shift').value,
      by: getEl('by').value, rows,
      incidents: getEl('incidents').value, actions: getEl('actions').value,
      noIssues, noActions
    }));
  } catch(e){}
}
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
  catch(e) { return null; }
}
function getEl(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s) {
  return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ===== Row rendering =====
function renderRows() {
  const container = getEl('rows');
  container.innerHTML = '';
  rows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'row-grid';
    div.innerHTML = `
      <input placeholder="e.g. IMM-01" value="${escapeAttr(row.machine)}" data-i="${i}" data-f="machine" />
      <select data-i="${i}" data-f="status">
        ${STATUSES.map(s => `<option${s === row.status ? ' selected' : ''}>${s}</option>`).join('')}
      </select>
      <input placeholder="Report notes..." value="${escapeAttr(row.report)}" data-i="${i}" data-f="report" />
      <button class="btn btn-remove" data-i="${i}" data-act="remove">✕</button>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('input, select').forEach(el => {
    const handler = e => {
      const i = +e.target.dataset.i;
      const f = e.target.dataset.f;
      let val = e.target.value;
      if (f === 'machine') {
        const upper = val.toUpperCase();
        if (upper !== val) e.target.value = upper;
        val = upper;
      }
      rows[i][f] = val;
      saveState();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  container.querySelectorAll('button[data-act="remove"]').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = +e.currentTarget.dataset.i;
      rows.splice(i, 1); renderRows(); saveState();
    });
  });
}

// ===== Checkboxes =====
function updateChk() {
  const ni = getEl('noIssuesChk');
  const na = getEl('noActionsChk');
  ni.className = 'chk' + (noIssues ? ' on' : '');
  ni.textContent = noIssues ? '✓' : '';
  na.className = 'chk' + (noActions ? ' on' : '');
  na.textContent = noActions ? '✓' : '';

  const inc = getEl('incidents'), act = getEl('actions');
  if (noIssues) { inc.value = 'None — no issues reported.'; inc.disabled = true; }
  else { if (inc.value === 'None — no issues reported.') inc.value = ''; inc.disabled = false; }
  if (noActions) { act.value = 'None — no action required.'; act.disabled = true; }
  else { if (act.value === 'None — no action required.') act.value = ''; act.disabled = false; }
}
getEl('noIssuesLabel').addEventListener('click', e => {
  e.preventDefault();
  noIssues = !noIssues; updateChk(); saveState();
});
getEl('noActionsLabel').addEventListener('click', e => {
  e.preventDefault();
  noActions = !noActions; updateChk(); saveState();
});

// ===== Build Markdown (for Teams) =====
function buildMarkdown() {
  const date = getEl('date').value;
  const shift = getEl('shift').value;
  const by = getEl('by').value;
  const filtered = rows.filter(r => (r.machine||'').trim());
  const incText = noIssues ? 'None — no issues reported.' : getEl('incidents').value.trim();
  const actText = noActions ? 'None — no action required.' : getEl('actions').value.trim();

  const parts = [];
  parts.push(`📋 **SHIFT HANDOVER** — ${date} — ${shift} Shift`);
  parts.push(`**Handover By:** ${by || '—'}`);
  parts.push('');

  if (filtered.length > 0) {
    parts.push('| Machine | Status | Report |');
    parts.push('|---|---|---|');
    filtered.forEach(r => {
      parts.push(`| ${r.machine} | ${r.status} | ${r.report || '—'} |`);
    });
    parts.push('');
  }
  if (incText) { parts.push(`⚠️ **Incidents / Issues:** ${incText}`); parts.push(''); }
  if (actText) { parts.push(`📌 **Actions Required:** ${actText}`); }
  return parts.join('\n');
}

// ===== Build Preview HTML =====
function renderPreview() {
  const date = getEl('date').value;
  const shift = getEl('shift').value;
  const by = getEl('by').value;
  const filtered = rows.filter(r => (r.machine||'').trim());
  const incText = noIssues ? 'None — no issues reported.' : getEl('incidents').value.trim();
  const actText = noActions ? 'None — no action required.' : getEl('actions').value.trim();

  let html = '';
  html += `<div class="preview-heading">📋 SHIFT HANDOVER — ${escapeHtml(date)} — ${escapeHtml(shift)} Shift</div>`;
  html += `<div class="preview-meta"><strong>Handover By:</strong> ${escapeHtml(by || '—')}</div>`;

  if (filtered.length > 0) {
    html += '<table class="preview-table"><thead><tr><th>Machine</th><th>Status</th><th>Report</th></tr></thead><tbody>';
    filtered.forEach(r => {
      html += `<tr><td>${escapeHtml(r.machine)}</td><td>${escapeHtml(r.status)}</td><td>${escapeHtml(r.report || '—')}</td></tr>`;
    });
    html += '</tbody></table>';
  }
  if (incText) html += `<div class="preview-section"><strong>⚠️ Incidents / Issues:</strong> ${escapeHtml(incText)}</div>`;
  if (actText) html += `<div class="preview-section"><strong>📌 Actions Required:</strong> ${escapeHtml(actText)}</div>`;

  getEl('preview').innerHTML = html;
}

// ===== Generate =====
getEl('generate').addEventListener('click', () => {
  renderPreview();
  getEl('outputCard').style.display = 'block';
  const btn = getEl('copyBtn');
  btn.textContent = 'Copy'; btn.classList.remove('copied');
  setTimeout(() => {
    getEl('outputCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
});

// ===== Copy =====
getEl('copyBtn').addEventListener('click', () => {
  const text = buildMarkdown();
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(fallback);
  else fallback();
  const btn = getEl('copyBtn');
  btn.textContent = '✓ Copied'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2500);
});

// ===== Add Row =====
getEl('addRow').addEventListener('click', () => {
  rows.push({ machine: '', status: '✅ Running', report: '' });
  renderRows(); saveState();
});

// ===== Persist top-level inputs =====
['date','shift','by','incidents','actions'].forEach(id => {
  getEl(id).addEventListener('input', saveState);
  getEl(id).addEventListener('change', saveState);
});

// ===== Init =====
(function init() {
  const saved = loadState();
  if (saved) {
    getEl('date').value = saved.date || new Date().toISOString().slice(0,10);
    getEl('shift').value = saved.shift || 'Morning';
    getEl('by').value = saved.by || '';
    getEl('incidents').value = saved.incidents || '';
    getEl('actions').value = saved.actions || '';
    rows = (saved.rows && saved.rows.length) ? saved.rows : [
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' }
    ];
    noIssues = !!saved.noIssues; noActions = !!saved.noActions;
  } else {
    getEl('date').value = new Date().toISOString().slice(0,10);
    rows = [
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' },
      { machine: '', status: '✅ Running', report: '' }
    ];
  }
  renderRows(); updateChk();
})();

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
