<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1b2e4b"/>
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Single assembly line / packing cell, scaled to fill canvas -->
    <g transform="translate(40,40) scale(10.0)">
      <!-- Conveyor rollers -->
      <circle cx="6"  cy="33" r="3" stroke-width="1.0"/>
      <circle cx="38" cy="33" r="3" stroke-width="1.0"/>
      <!-- Belt top & bottom -->
      <line x1="6" y1="30" x2="38" y2="30" stroke-width="1.0"/>
      <line x1="6" y1="36" x2="38" y2="36" stroke-width="1.0"/>
      <!-- Box A -->
      <rect x="7" y="21" width="9" height="9" rx="1" stroke-width="1.0"/>
      <line x1="11.5" y1="21" x2="11.5" y2="30" stroke-width="0.7"/>
      <!-- Box B -->
      <rect x="19" y="21" width="9" height="9" rx="1" stroke-width="1.0"/>
      <line x1="23.5" y1="21" x2="23.5" y2="30" stroke-width="0.7"/>
      <!-- Box C -->
      <rect x="31" y="21" width="9" height="9" rx="1" stroke-width="1.0"/>
      <line x1="35.5" y1="21" x2="35.5" y2="30" stroke-width="0.7"/>
      <!-- Robot arm vertical -->
      <line x1="22" y1="4" x2="22" y2="16" stroke-width="1.2"/>
      <!-- Robot arm horizontal -->
      <line x1="10" y1="9" x2="34" y2="9" stroke-width="1.0"/>
      <!-- End effector / gripper -->
      <line x1="10" y1="9"  x2="10" y2="16" stroke-width="1.0"/>
      <line x1="8"  y1="16" x2="12" y2="16" stroke-width="1.2"/>
      <!-- Pivot dot -->
      <circle cx="22" cy="4" r="1.5" stroke-width="0.9"/>
    </g>
  </g>
</svg>
