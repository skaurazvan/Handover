<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1b2e4b"/>
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Single injection moulding machine centered -->
    <g transform="translate(40,40) scale(10.0)">
      <!-- Hopper -->
      <path d="M14 4 L11 11 L17 11 Z" stroke-width="1.0"/>
      <!-- Barrel body -->
      <rect x="3" y="18" width="22" height="8" rx="1.5" stroke-width="1.0"/>
      <!-- Screw threads -->
      <line x1="7"  y1="18" x2="7"  y2="26" stroke-width="0.7" stroke-dasharray="1.5 2"/>
      <line x1="11" y1="18" x2="11" y2="26" stroke-width="0.7" stroke-dasharray="1.5 2"/>
      <line x1="15" y1="18" x2="15" y2="26" stroke-width="0.7" stroke-dasharray="1.5 2"/>
      <line x1="19" y1="18" x2="19" y2="26" stroke-width="0.7" stroke-dasharray="1.5 2"/>
      <!-- Nozzle -->
      <path d="M25 20.5 L28 22 L25 23.5" stroke-width="1.0"/>
      <!-- Fixed platen -->
      <rect x="29" y="16" width="4" height="12" rx="1" stroke-width="1.0"/>
      <!-- Moving platen -->
      <rect x="35" y="17.5" width="4" height="9" rx="1" stroke-width="1.0"/>
      <!-- Tie bars -->
      <line x1="29" y1="17.5" x2="39" y2="17.5" stroke-width="0.7" stroke-dasharray="2 2"/>
      <line x1="29" y1="26.5" x2="39" y2="26.5" stroke-width="0.7" stroke-dasharray="2 2"/>
      <!-- Base -->
      <rect x="2" y="30" width="40" height="4" rx="1" stroke-width="1.0"/>
      <!-- Hopper stem -->
      <line x1="14" y1="11" x2="14" y2="18" stroke-width="1.0"/>
    </g>
  </g>
</svg>
